name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Build & Deploy Frontend to AWS Amplify
  # ──────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend (Amplify)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Amplify
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Start Amplify deployment
        run: |
          aws amplify start-job \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name main \
            --job-type RELEASE

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Deploy Backend to Elastic Beanstalk
  # ──────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Elastic Beanstalk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Create deployment package
        run: |
          # Zip everything except node_modules, .git, dist and dev files
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "node_modules/*" \
            --exclude "dist/*" \
            --exclude "*.env*" \
            --exclude "roads_extracted.json" \
            --exclude "*.py" \
            --exclude ".vscode/*"

      - name: Upload to S3
        run: |
          aws s3 cp deploy.zip \
            s3://${{ secrets.EB_S3_BUCKET }}/smart-road-gis/deploy-${{ github.sha }}.zip

      - name: Create new EB application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name smart-road-gis \
            --version-label "v-${{ github.sha }}" \
            --source-bundle S3Bucket=${{ secrets.EB_S3_BUCKET }},S3Key=smart-road-gis/deploy-${{ github.sha }}.zip \
            --description "Deploy from GitHub Actions - ${{ github.event.head_commit.message }}"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name smart-road-gis \
            --environment-name smart-road-gis-prod \
            --version-label "v-${{ github.sha }}"

      - name: Wait for deployment to complete
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name smart-road-gis \
            --environment-names smart-road-gis-prod
          echo "✅ Deployment complete!"
